# main 上的 _book/（本地用 tools/build-book.sh 生成）有更新时，同步到 gh-pages 分支，
# 由 GitHub Pages 从 gh-pages 分支发布。CI 中不构建：构建需要 R、bookdown 和本地底本。
name: pages

on:
  push:
    branches: [main]
    paths: ['_book/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 推送 _book 到 gh-pages
        run: |
          cd _book
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "发布网页（main ${GITHUB_SHA::7}）"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
