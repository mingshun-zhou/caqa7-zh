# 把已提交的 _book/（本地用 tools/build-book.sh 生成）发布到 GitHub Pages。
# 本仓库不在 CI 中构建：构建需要 R、bookdown 和本地底本，结果直接随提交入库。
name: pages

on:
  push:
    branches: [main]
    paths: ['_book/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 禁用 Jekyll
        run: touch _book/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book
      - id: deployment
        uses: actions/deploy-pages@v4
