bookdown::gitbook:
  split_by: section
  css: css/style.css
  config:
    toc:
      collapse: section
      before: |
        <li><a href="./">计算机体系结构：量化研究方法（第 7 版）</a></li>
    download: no
    search: yes
    sharing: no
  pandoc_args: "--variable=lang:zh-CN"
bookdown::pdf_book:
  latex_engine: xelatex
  pandoc_args: "--top-level-division=chapter"
  toc_depth: 3
